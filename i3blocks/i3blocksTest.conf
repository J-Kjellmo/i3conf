# Global properties
separator=true
separator_block_width=15\n


[calendar]
command=/home/kjellmo/.config/i3/scripts/calendar
interval=1
LABEL= 
DATEFMT=+%a %d.%m.%Y %H:%M:%S
# SHORTFMT=+%H:%M:%S
HEIGHT=180
WIDTH=200
# SET HORIZONTAL ADJUSTMENT
instance=65

[battery2]
command=/home/kjellmo/.config/i3/scripts/battery2
markup=pango
interval=30

[disk]
command=/home/kjellmo/.config/i3/scripts/disk
LABEL= 
#DIR=/home/kjellmo
#ALERT_LOW=10
interval=30

[memory]
command=/home/kjellmo/.config/i3/scripts/memory
markup=pango
label=MEM 
interval=30

[cpu_usage]
command=/home/kjellmo/.config/i3/scripts/cpu_usage
interval=10
LABEL=CPU 
#min_width=CPU: 100.00%
#T_WARN=50
#T_CRIT=80
#DECIMALS=2
#COLOR_NORMAL=#EBDBB2
#COLOR_WARN=#FFFC00
#COLOR_CRIT=#FF0000

[iface]
command=/home/kjellmo/.config/i3/scripts/iface
#LABEL=wlan0:
#IFACE=wlan0
#ADDRESS_FAMILY=inet6?
color=#9fff9f
interval=10
# set this to 1 to display the name of the connected WIFI interface instead of the IP address.
display_wifi_name=0

[bandwidth3]
command=/home/kjellmo/.config/i3/scripts/bandwidth3
interval=persist
markup=pango
#LABEL=<span font='FontAwesome'>  </span>
#IFACE=[automatically determined]
#DT=3
#UNIT=Mb
# Exposed variables: rx, wx, tx, unit, iface
#PRINTF_COMMAND=printf "%-5.1f/%5.1f %s/s
", rx, wx, unit;

